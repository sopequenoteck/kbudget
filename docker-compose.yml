services:
  api:
    image: sopequenotech/k-budget-api:latest
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Chemin fixe dans le container : le volume api-avatars est monte dessus.
      # Pour stocker les avatars ailleurs sur l'hote, modifier la source du
      # volume ci-dessous, pas cette variable.
      AVATAR_STORAGE_PATH: /app/data/avatars
    ports:
      - "3001:8080"
    volumes:
      - api-logs:/app/logs
      - api-avatars:/app/data/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  app:
    image: sopequenotech/k-budget-app:latest
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  api-logs:
  api-avatars:
