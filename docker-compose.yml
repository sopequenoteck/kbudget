services:
  api:
    image: sopequenotech/k-budget-api:latest
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Sans cette variable, seul le domaine par defaut du profil prod est
      # accepte et le frontend recoit 403 "Invalid CORS request" au login.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Sans cette ligne, relever le minimum dans .env resterait sans effet :
      # la variable n'atteindrait pas le container (KKS-314).
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION}
      # Chemin fixe dans le container : le volume api-avatars est monte dessus.
      # Pour stocker les avatars ailleurs sur l'hote, modifier la source du
      # volume ci-dessous, pas cette variable.
      AVATAR_STORAGE_PATH: /app/data/avatars
    ports:
      - "3001:8080"
    volumes:
      - api-logs:/app/logs
      - api-avatars:/app/data/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  app:
    image: sopequenotech/k-budget-app:latest
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  api-logs:
  api-avatars:
