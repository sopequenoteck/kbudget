<div class="dialog-overlay" (click)="onCancel()" role="presentation"></div>
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  class="dialog-panel"
  (click)="$event.stopPropagation()"
  role="dialog"
  [attr.aria-label]="'debts.dialog.snoozeTitle' | transloco"
>
  <h3>{{ 'debts.dialog.snoozeTitle' | transloco }}</h3>

  @if (errorMessage()) {
    <div class="form-error-banner">{{ errorMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-field
      [label]="'debts.form.reminderDate' | transloco"
      fieldId="reminderDate"
      [showError]="isInvalid('reminderDate')"
      [errorMessage]="getDateError()"
    >
      <input id="reminderDate" type="date" formControlName="reminderDate" />
    </app-form-field>

    <app-form-field
      [label]="'debts.form.reminderTime' | transloco"
      fieldId="reminderTime"
      [showError]="isInvalid('reminderTime')"
      [errorMessage]="'debts.dialog.reminderTimeRequired' | transloco"
    >
      <input id="reminderTime" type="time" formControlName="reminderTime" />
    </app-form-field>

    <div class="dialog-actions">
      <button type="button" class="btn-outline" (click)="onCancel()">{{ 'common.action.cancel' | transloco }}</button>
      <button type="submit" class="btn-primary" [disabled]="submitting() || form.invalid">
        {{ submitting() ? ('debts.dialog.snoozing' | transloco) : ('debts.action.snooze' | transloco) }}
      </button>
    </div>
  </form>
</div>
