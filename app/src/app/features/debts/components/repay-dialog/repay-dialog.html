<form [formGroup]="form" (ngSubmit)="onSubmit()" class="repay-form">
  @if (errorMessage()) {
    <div class="repay-form__error">{{ errorMessage() }}</div>
  }

  <div class="repay-form__top">
    <div class="repay-form__handle-bar"></div>
    <div class="repay-form__top-title">
      <ng-icon name="phosphorArrowCircleDown" size="16" />
      <span>Remboursement</span>
    </div>
    <span class="repay-form__remaining">Restant : {{ debtMontantRestant() | amount: null : debtCurrency() }}</span>
  </div>

  <div class="repay-form__main-row">
    <span class="repay-form__personne">{{ debtPersonne() }}</span>
    <div class="repay-form__amount-group">
      <input
        class="repay-form__amount amount--income"
        [style.width]="amountWidth()"
        type="text"
        inputmode="decimal"
        formControlName="amount"
        placeholder="0"
        autocomplete="off"
      />
      <span class="repay-form__currency currency--income">{{ currencySymbol() }}</span>
    </div>
  </div>

  <div class="repay-form__meta-row">
    <div class="repay-form__meta-pills">
      <button
        type="button"
        class="repay-form__tool-pill"
        [class.active]="expandedSection() === 'account'"
        (click)="toggleSection('account')"
        aria-label="Compte"
      >
        <ng-icon name="phosphorWallet" size="16" [style.color]="selectedAccountColor()" style="opacity: 0.7" />
        <span>{{ selectedAccountName() ?? 'Compte' }}</span>
      </button>
    </div>
  </div>

  @if (expandedSection() === 'account') {
    <div class="repay-form__expand">
      <app-select-picker
        formControlName="accountId"
        [items]="accountItems()"
        placeholder="Sélectionner un compte"
        [clearable]="false"
      />
    </div>
  }

  <div class="repay-form__bottom-row">
    <button
      type="button"
      class="repay-form__action-pill repay-form__action-pill--cancel"
      (click)="onCancel()"
    >
      Annuler
    </button>
    <button
      type="submit"
      class="repay-form__action-pill repay-form__action-pill--primary"
      [disabled]="submitting()"
    >
      {{ submitting() ? '...' : 'Rembourser' }}
    </button>
  </div>
</form>
