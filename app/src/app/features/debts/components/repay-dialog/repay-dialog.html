<form [formGroup]="form" (ngSubmit)="onSubmit()" class="k-bsheet">
  @if (errorMessage()) {
    <div class="k-bsheet__error">{{ errorMessage() }}</div>
  }

  <div class="k-bsheet__top">
    <div class="k-bsheet__handle"></div>
    <div class="k-bsheet__top-title">
      <ng-icon name="phosphorArrowCircleDown" size="16" />
      <span>{{ 'debts.dialog.repayTitle' | transloco }}</span>
    </div>
    <span class="repay-form__remaining">{{ 'debts.dialog.remaining' | transloco: { amount: (debtMontantRestant() | amount: null : debtCurrency()) } }}</span>
  </div>

  <div class="k-bsheet__main-row k-bsheet__main-row--between">
    <span class="repay-form__personne">{{ debtPersonne() }}</span>
    <div class="k-bsheet__amount-group">
      <input
        class="k-bsheet__amount k-bsheet__amount--sm k-bsheet__amount--right k-bsheet__amount--income k-input-naked"
        [style.width]="amountWidth()"
        type="text"
        inputmode="decimal"
        formControlName="amount"
        placeholder="0"
        autocomplete="off"
      />
      <span class="k-bsheet__currency k-bsheet__currency--sm k-bsheet__currency--income">{{ currencySymbol() }}</span>
    </div>
  </div>

  <div class="k-bsheet__meta-row k-bsheet__meta-row--end">
    <div class="k-bsheet__meta-pills">
      <button
        type="button"
        class="k-bsheet__tool-pill"
        [class.active]="expandedSection() === 'account'"
        (click)="toggleSection('account')"
        [attr.aria-label]="'debts.form.accountAria' | transloco"
      >
        <ng-icon name="phosphorWallet" size="16" [style.color]="selectedAccountColor()" style="opacity: 0.7" />
        <span>{{ selectedAccountName() ?? ('debts.form.account' | transloco) }}</span>
      </button>
    </div>
  </div>

  @if (expandedSection() === 'account') {
    <div class="k-bsheet__expand" @expandCollapse>
      <app-select-picker
        formControlName="accountId"
        [items]="accountItems()"
        [placeholder]="'debts.form.accountPlaceholder' | transloco"
        [clearable]="false"
      />
    </div>
  }

  <div class="k-bsheet__bottom-row">
    <button
      type="button"
      class="k-bsheet__action-pill k-bsheet__action-pill--cancel"
      (click)="onCancel()"
    >
      {{ 'common.action.cancel' | transloco }}
    </button>
    <button
      type="submit"
      class="k-bsheet__action-pill k-bsheet__action-pill--primary"
      [disabled]="submitting()"
    >
      {{ submitting() ? '...' : ('debts.action.repay' | transloco) }}
    </button>
  </div>
</form>
