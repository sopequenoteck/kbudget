<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bsheet">
  @if (errorMessage()) {
    <div class="bsheet__error">{{ errorMessage() }}</div>
  }

  <div class="bsheet__top">
    <div class="bsheet__handle"></div>
    <div class="bsheet__top-title">
      <ng-icon name="phosphorArrowCircleDown" size="16" />
      <span>Remboursement</span>
    </div>
    <span class="repay-form__remaining">Restant : {{ debtMontantRestant() | amount: null : debtCurrency() }}</span>
  </div>

  <div class="bsheet__main-row bsheet__main-row--between">
    <span class="repay-form__personne">{{ debtPersonne() }}</span>
    <div class="bsheet__amount-group">
      <input
        class="bsheet__amount bsheet__amount--sm bsheet__amount--right bsheet__amount--income input-naked"
        [style.width]="amountWidth()"
        type="text"
        inputmode="decimal"
        formControlName="amount"
        placeholder="0"
        autocomplete="off"
      />
      <span class="bsheet__currency bsheet__currency--sm bsheet__currency--income">{{ currencySymbol() }}</span>
    </div>
  </div>

  <div class="bsheet__meta-row bsheet__meta-row--end">
    <div class="bsheet__meta-pills">
      <button
        type="button"
        class="bsheet__tool-pill"
        [class.active]="expandedSection() === 'account'"
        (click)="toggleSection('account')"
        aria-label="Compte"
      >
        <ng-icon name="phosphorWallet" size="16" [style.color]="selectedAccountColor()" style="opacity: 0.7" />
        <span>{{ selectedAccountName() ?? 'Compte' }}</span>
      </button>
    </div>
  </div>

  @if (expandedSection() === 'account') {
    <div class="bsheet__expand" @expandCollapse>
      <app-select-picker
        formControlName="accountId"
        [items]="accountItems()"
        placeholder="Sélectionner un compte"
        [clearable]="false"
      />
    </div>
  }

  <div class="bsheet__bottom-row">
    <button
      type="button"
      class="bsheet__action-pill bsheet__action-pill--cancel"
      (click)="onCancel()"
    >
      Annuler
    </button>
    <button
      type="submit"
      class="bsheet__action-pill bsheet__action-pill--primary"
      [disabled]="submitting()"
    >
      {{ submitting() ? '...' : 'Rembourser' }}
    </button>
  </div>
</form>
