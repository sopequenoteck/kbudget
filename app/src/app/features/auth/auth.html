<app-auth-shell title="K-Budget" [tagline]="'auth.page.loginTagline' | transloco" [error]="errorMessage()">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <app-form-field
      [label]="'auth.form.email' | transloco"
      fieldId="login-email"
      prefixIcon="phosphorEnvelope"
      [errorMessage]="
        (loginForm.controls.email.hasError('required') ? 'auth.form.emailRequired' : 'auth.form.emailInvalid')
          | transloco
      "
      [showError]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
    >
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'auth.form.emailPlaceholder' | transloco"
        [class.input-error]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
      />
    </app-form-field>

    <app-form-field
      [label]="'auth.form.password' | transloco"
      fieldId="login-password"
      prefixIcon="phosphorLock"
      [errorMessage]="'auth.form.passwordRequired' | transloco"
      [showError]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
    >
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [placeholder]="'auth.form.loginPasswordPlaceholder' | transloco"
        [class.input-error]="
          loginForm.controls.password.touched && loginForm.controls.password.invalid
        "
      />
    </app-form-field>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="loading()">
        @if (loading()) {
          {{ 'auth.feedback.signingIn' | transloco }}
        } @else {
          {{ 'auth.action.signIn' | transloco }}
        }
      </button>
    </div>
  </form>
</app-auth-shell>
