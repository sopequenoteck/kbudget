<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="icons/budget-icon-no-background.svg" alt="K-Budget" class="auth-logo" />
      <div class="auth-header-text">
        <h1>K-Budget</h1>
        <p>
          @if (mode() === 'login') {
            Connectez-vous à votre compte
          } @else {
            Créez votre compte
          }
        </p>
      </div>
    </div>

    <div class="auth-tabs">
      <button
        type="button"
        class="auth-tab"
        [class.active]="mode() === 'login'"
        (click)="toggleMode()"
      >
        Connexion
      </button>
      <button
        type="button"
        class="auth-tab"
        [class.active]="mode() === 'register'"
        (click)="toggleMode()"
      >
        Inscription
      </button>
    </div>

    @if (errorMessage()) {
      <div class="auth-error">{{ errorMessage() }}</div>
    }

    @if (mode() === 'login') {
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <app-form-field
          label="Email"
          fieldId="login-email"
          [errorMessage]="
            loginForm.controls.email.hasError('required') ? 'Email requis' : 'Email invalide'
          "
          [showError]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
        >
          <input
            id="login-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="votre@email.com"
            [class.input-error]="
              loginForm.controls.email.touched && loginForm.controls.email.invalid
            "
          />
        </app-form-field>

        <app-form-field
          label="Mot de passe"
          fieldId="login-password"
          errorMessage="6 caractères minimum"
          [showError]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
        >
          <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Votre mot de passe"
            [class.input-error]="
              loginForm.controls.password.touched && loginForm.controls.password.invalid
            "
          />
        </app-form-field>

        <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
          @if (loading()) {
            Connexion...
          } @else {
            Se connecter
          }
        </button>
      </form>

      <div class="auth-footer">
        <span>Pas encore de compte ?</span>
        <button type="button" (click)="toggleMode()">Inscrivez-vous</button>
      </div>
    }

    @if (mode() === 'register') {
      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <app-form-field label="Nom" fieldId="register-name" [showError]="false">
          <input
            id="register-name"
            type="text"
            formControlName="name"
            autocomplete="name"
            placeholder="Votre nom (optionnel)"
          />
        </app-form-field>

        <app-form-field
          label="Email"
          fieldId="register-email"
          [errorMessage]="
            registerForm.controls.email.hasError('required') ? 'Email requis' : 'Email invalide'
          "
          [showError]="registerForm.controls.email.touched && registerForm.controls.email.invalid"
        >
          <input
            id="register-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="votre@email.com"
            [class.input-error]="
              registerForm.controls.email.touched && registerForm.controls.email.invalid
            "
          />
        </app-form-field>

        <app-form-field
          label="Mot de passe"
          fieldId="register-password"
          errorMessage="6 caractères minimum"
          [showError]="
            registerForm.controls.password.touched && registerForm.controls.password.invalid
          "
        >
          <input
            id="register-password"
            type="password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Votre mot de passe"
            [class.input-error]="
              registerForm.controls.password.touched && registerForm.controls.password.invalid
            "
          />
        </app-form-field>

        <app-form-field
          label="Confirmer le mot de passe"
          fieldId="register-confirm-password"
          [errorMessage]="
            registerForm.controls.confirmPassword.hasError('required')
              ? 'Confirmation requise'
              : 'Les mots de passe ne correspondent pas'
          "
          [showError]="
            (registerForm.controls.confirmPassword.touched &&
              registerForm.controls.confirmPassword.invalid) ||
            (registerForm.controls.confirmPassword.touched && registerForm.hasError('passwordMismatch'))
          "
        >
          <input
            id="register-confirm-password"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Confirmez votre mot de passe"
            [class.input-error]="
              (registerForm.controls.confirmPassword.touched &&
                registerForm.controls.confirmPassword.invalid) ||
              (registerForm.controls.confirmPassword.touched &&
                registerForm.hasError('passwordMismatch'))
            "
          />
        </app-form-field>

        <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
          @if (loading()) {
            Création...
          } @else {
            Créer mon compte
          }
        </button>
      </form>

      <div class="auth-footer">
        <span>Déjà un compte ?</span>
        <button type="button" (click)="toggleMode()">Connectez-vous</button>
      </div>
    }
  </div>
</div>
