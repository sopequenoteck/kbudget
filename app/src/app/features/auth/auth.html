<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1>K-Budget</h1>
      <p>Connectez-vous à votre compte</p>
    </div>

    @if (errorMessage()) {
      <div class="auth-error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <app-form-field
        label="Email"
        fieldId="email"
        [errorMessage]="
          loginForm.controls.email.hasError('required') ? 'Email requis' : 'Email invalide'
        "
        [showError]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
      >
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="votre@email.com"
          [class.input-error]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
        />
      </app-form-field>

      <app-form-field
        label="Mot de passe"
        fieldId="password"
        errorMessage="6 caractères minimum"
        [showError]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
      >
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Votre mot de passe"
          [class.input-error]="
            loginForm.controls.password.touched && loginForm.controls.password.invalid
          "
        />
      </app-form-field>

      <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
          Connexion...
        } @else {
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
