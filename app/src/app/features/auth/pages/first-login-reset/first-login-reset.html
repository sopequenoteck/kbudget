<app-auth-shell
  size="md"
  [title]="'auth.page.firstLoginTitle' | transloco"
  [tagline]="'auth.page.firstLoginTagline' | transloco"
  [error]="errorMessage() ?? ''"
>
  <div class="flr-notice">
    <p>
      {{ 'auth.page.firstLoginNotice' | transloco }}
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    @let emailError = getEmailErrorInfo();
    <app-form-field
      [label]="'auth.form.finalEmail' | transloco"
      fieldId="flr-email"
      prefixIcon="phosphorEnvelope"
      [errorMessage]="emailError.key | transloco: emailError.params"
      [showError]="form.controls.email.touched && form.controls.email.invalid"
    >
      <input
        id="flr-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'auth.form.emailPlaceholder' | transloco"
        [class.input-error]="form.controls.email.touched && form.controls.email.invalid"
      />
    </app-form-field>

    <app-form-field
      [label]="'auth.form.displayName' | transloco"
      fieldId="flr-displayname"
      prefixIcon="phosphorUser"
      [errorMessage]="'auth.form.displayNameRequired' | transloco"
      [showError]="form.controls.displayName.touched && form.controls.displayName.invalid"
    >
      <input
        id="flr-displayname"
        type="text"
        formControlName="displayName"
        autocomplete="name"
        [placeholder]="'auth.form.displayNamePlaceholder' | transloco"
        [class.input-error]="
          form.controls.displayName.touched && form.controls.displayName.invalid
        "
      />
    </app-form-field>

    @let passwordError = getPasswordErrorInfo();
    <app-form-field
      [label]="'auth.form.newPassword' | transloco"
      fieldId="flr-password"
      prefixIcon="phosphorLock"
      [errorMessage]="passwordError.key | transloco: passwordError.params"
      [showError]="form.controls.password.touched && form.controls.password.invalid"
    >
      <input
        id="flr-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [placeholder]="'auth.form.passwordPlaceholder' | transloco: { min: passwordMinLength }"
        [class.input-error]="form.controls.password.touched && form.controls.password.invalid"
      />
    </app-form-field>

    <app-form-field
      [label]="'auth.form.confirmPassword' | transloco"
      fieldId="flr-password-confirm"
      prefixIcon="phosphorLock"
      [errorMessage]="'auth.form.passwordMismatch' | transloco"
      [showError]="
        form.controls.passwordConfirm.touched && form.controls.passwordConfirm.invalid
      "
    >
      <input
        id="flr-password-confirm"
        type="password"
        formControlName="passwordConfirm"
        autocomplete="new-password"
        [placeholder]="'auth.form.confirmPasswordPlaceholder' | transloco"
        [class.input-error]="
          form.controls.passwordConfirm.touched && form.controls.passwordConfirm.invalid
        "
      />
    </app-form-field>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          {{ 'common.feedback.saving' | transloco }}
        } @else {
          {{ 'auth.action.confirmCredentials' | transloco }}
        }
      </button>
    </div>
  </form>
</app-auth-shell>
