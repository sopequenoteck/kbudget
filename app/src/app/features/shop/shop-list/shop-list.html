<section class="product-filter" role="group" aria-label="Filtrer les produits">
  <button
    class="product-filter__btn"
    [class.active]="filter() === 'active'"
    (click)="setFilter('active')"
  >
    Actifs
  </button>
  <button
    class="product-filter__btn"
    [class.active]="filter() === 'inactive'"
    (click)="setFilter('inactive')"
  >
    Inactifs
  </button>
  <button
    class="product-filter__btn"
    [class.active]="filter() === 'all'"
    (click)="setFilter('all')"
  >
    Tous
  </button>
</section>

@if (loading()) {
  <ul class="product-list">
    @for (item of skeletonItems; track $index) {
      <li class="skeleton-item">
        <div class="skeleton-circle"></div>
        <div class="skeleton-lines">
          <div class="skeleton-line skeleton-line--title"></div>
          <div class="skeleton-line skeleton-line--subtitle"></div>
        </div>
        <div class="skeleton-lines skeleton-lines--right">
          <div class="skeleton-line skeleton-line--value"></div>
          <div class="skeleton-line skeleton-line--small"></div>
        </div>
      </li>
    }
  </ul>
} @else if (error()) {
  <div class="state-error">
    <p>Erreur de chargement</p>
    <button class="btn-outline" (click)="loadData()">Réessayer</button>
  </div>
} @else if (filteredProducts().length === 0) {
  <div class="state-empty">
    <span class="state-empty__icon">🏪</span>
    <p>Aucun produit</p>
    <button class="btn-primary" (click)="onCreate()">Créer un produit</button>
  </div>
} @else {
  <ul class="product-list">
    @for (product of filteredProducts(); track product.id) {
      <li [style.opacity]="!product.actif || product.stock === 0 ? 0.5 : 1">
        <app-list-item
          [icon]="product.icone ?? '📦'"
          [imageUrl]="product.imageUrl"
          [title]="product.nom"
          [value]="product.prixVente | amount"
          [subtitle]="'Stock\u00a0: ' + product.stock"
          [rightSubtitle]="product.stock === 0 ? 'Rupture' : product.totalVendu + ' ventes'"
          (pressed)="onProductPressed(product)"
        />
      </li>
    }
  </ul>
  <div class="list-fab-spacer"></div>
}
