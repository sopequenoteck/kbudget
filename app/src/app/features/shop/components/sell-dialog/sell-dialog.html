<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bsheet">
  @if (errorMessage()) {
    <div class="bsheet__error">{{ errorMessage() }}</div>
  }

  <div class="bsheet__top">
    <div class="bsheet__handle"></div>
    <div class="bsheet__top-title">
      <ng-icon name="phosphorShoppingBag" size="16" />
      <span>Vente rapide</span>
    </div>
    @if (selectedProduct(); as p) {
      <span class="sell-form__remaining">Stock : {{ p.stock }}</span>
    }
  </div>

  <div class="bsheet__main-row">
    <button type="button" class="sell-form__product-name" [class.has-value]="!!selectedProduct()" [class.active]="expandedSection() === 'product'" (click)="toggleSection('product')">
      @if (selectedProduct()?.imageUrl; as img) {
        <img class="sell-form__product-img" [src]="img" [alt]="selectedProduct()?.nom" />
      } @else if (selectedProduct()?.icone; as icone) {
        <span class="sell-form__product-icon">{{ icone }}</span>
      }
      {{ selectedProduct()?.nom ?? 'Produit' }}
    </button>
    <div class="bsheet__amount-group">
      <input
        class="bsheet__amount bsheet__amount--sm bsheet__amount--right bsheet__amount--income input-naked"
        [style.width]="amountWidth()"
        type="text"
        inputmode="decimal"
        formControlName="totalPrice"
        placeholder="0"
        autocomplete="off"
      />
      <span class="bsheet__currency bsheet__currency--sm bsheet__currency--income">{{ currencySymbol() }}</span>
    </div>
  </div>

  @if (selectedProduct()?.description; as desc) {
    <div class="sell-form__description-preview">{{ desc }}</div>
  }

  <div class="bsheet__meta-row bsheet__meta-row--end">
    <div class="bsheet__meta-pills">
      <button
        type="button"
        class="bsheet__tool-pill"
        [class.active]="expandedSection() === 'quantity'"
        (click)="toggleSection('quantity')"
        aria-label="Quantité"
      >
        <ng-icon name="phosphorHash" size="16" style="opacity: 0.7" />
        <span>{{ form.get('quantity')?.value }}</span>
      </button>
    </div>
  </div>

  @if (expandedSection() === 'product') {
    <div class="bsheet__expand">
      <app-select-picker
        formControlName="productId"
        [items]="productItems()"
        placeholder="Sélectionner un produit"
        [clearable]="false"
      />
    </div>
  }
  @if (expandedSection() === 'quantity') {
    <div class="bsheet__expand">
      <input
        type="number"
        formControlName="quantity"
        [attr.min]="1"
        [attr.max]="maxStock()"
        class="bsheet__input input-naked"
      />
    </div>
  }

  <div class="bsheet__bottom-row">
    <button
      type="button"
      class="bsheet__action-pill bsheet__action-pill--cancel"
      (click)="onCancel()"
    >
      Annuler
    </button>
    <button
      type="submit"
      class="bsheet__action-pill bsheet__action-pill--primary"
      [disabled]="submitting()"
    >
      {{ submitting() ? '...' : 'Confirmer' }}
    </button>
  </div>
</form>
