<form [formGroup]="form" (ngSubmit)="onSubmit()" class="sell-dialog">
  @if (errorMessage()) {
    <div class="form-error-banner">{{ errorMessage() }}</div>
  }
  <app-form-field
    label="Produit"
    fieldId="productId"
    [showError]="isInvalid('productId')"
    [errorMessage]="'Sélectionnez un produit'"
  >
    <select id="productId" formControlName="productId" (change)="onProductChange()">
      <option value="" disabled>Choisir un produit</option>
      @for (p of sellableProducts(); track p.id) {
        <option [value]="p.id">{{ p.icone ?? '📦' }} {{ p.nom }} (stock: {{ p.stock }})</option>
      }
    </select>
  </app-form-field>

  <app-form-field
    label="Quantité"
    fieldId="quantity"
    [showError]="isInvalid('quantity')"
    [errorMessage]="'Quantité entre 1 et ' + maxStock()"
  >
    <input
      id="quantity"
      type="number"
      formControlName="quantity"
      [attr.min]="1"
      [attr.max]="maxStock()"
    />
  </app-form-field>

  @if (selectedProduct(); as sp) {
    <div class="sell-summary">
      Total : {{ sp.prixVente * form.get('quantity')!.value | number: '1.2-2' }} €
    </div>
  }

  <div class="form-actions">
    <button type="button" class="btn-outline" (click)="onCancel()">Annuler</button>
    <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Vente...' : 'Confirmer' }}
    </button>
  </div>
</form>
