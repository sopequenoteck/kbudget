<form [formGroup]="form" (ngSubmit)="onSubmit()" class="sell-form">
  @if (errorMessage()) {
    <div class="sell-form__error">{{ errorMessage() }}</div>
  }

  <div class="sell-form__top">
    <div class="sell-form__handle-bar"></div>
    <div class="sell-form__top-title">
      <ng-icon name="phosphorShoppingBag" size="16" />
      <span>Vente rapide</span>
    </div>
    @if (selectedProduct(); as p) {
      <span class="sell-form__remaining">Stock : {{ p.stock }}</span>
    }
  </div>

  <div class="sell-form__main-row">
    <button type="button" class="sell-form__product-name" [class.has-value]="!!selectedProduct()" [class.active]="expandedSection() === 'product'" (click)="toggleSection('product')">
      @if (selectedProduct()?.imageUrl; as img) {
        <img class="sell-form__product-img" [src]="img" [alt]="selectedProduct()?.nom" />
      } @else if (selectedProduct()?.icone; as icone) {
        <span class="sell-form__product-icon">{{ icone }}</span>
      }
      {{ selectedProduct()?.nom ?? 'Produit' }}
    </button>
    <div class="sell-form__amount-group">
      <input
        class="sell-form__amount amount--income"
        [style.width]="amountWidth()"
        type="text"
        inputmode="decimal"
        formControlName="totalPrice"
        placeholder="0"
        autocomplete="off"
      />
      <span class="sell-form__currency currency--income">{{ currencySymbol() }}</span>
    </div>
  </div>

  @if (selectedProduct()?.description; as desc) {
    <div class="sell-form__description-preview">{{ desc }}</div>
  }

  <div class="sell-form__meta-row">
    <div class="sell-form__meta-pills">
      <button
        type="button"
        class="sell-form__tool-pill"
        [class.active]="expandedSection() === 'quantity'"
        (click)="toggleSection('quantity')"
        aria-label="Quantité"
      >
        <ng-icon name="phosphorHash" size="16" style="opacity: 0.7" />
        <span>{{ form.get('quantity')?.value }}</span>
      </button>
    </div>
  </div>

  @if (expandedSection() === 'product') {
    <div class="sell-form__expand">
      <app-select-picker
        formControlName="productId"
        [items]="productItems()"
        placeholder="Sélectionner un produit"
        [clearable]="false"
      />
    </div>
  }
  @if (expandedSection() === 'quantity') {
    <div class="sell-form__expand">
      <input
        type="number"
        formControlName="quantity"
        [attr.min]="1"
        [attr.max]="maxStock()"
        class="sell-form__input"
      />
    </div>
  }

  <div class="sell-form__bottom-row">
    <button
      type="button"
      class="sell-form__action-pill sell-form__action-pill--cancel"
      (click)="onCancel()"
    >
      Annuler
    </button>
    <button
      type="submit"
      class="sell-form__action-pill sell-form__action-pill--primary"
      [disabled]="submitting()"
    >
      {{ submitting() ? '...' : 'Confirmer' }}
    </button>
  </div>
</form>
