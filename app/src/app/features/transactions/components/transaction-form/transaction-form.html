<form [formGroup]="form" (ngSubmit)="onSubmit()" class="transaction-form">
  @if (errorMessage()) {
    <div class="form-error-banner">{{ errorMessage() }}</div>
  }
  <div class="form-row form-row--label-amount">
    <app-form-field
      label="Libelle"
      fieldId="libelle"
      [showError]="isInvalid('libelle')"
      [errorMessage]="
        form.get('libelle')?.hasError('required') ? 'Libelle requis' : '255 caracteres maximum'
      "
    >
      <input id="libelle" type="text" formControlName="libelle" />
    </app-form-field>

    <app-form-field
      label="Montant"
      fieldId="montant"
      [showError]="isInvalid('montant')"
      [errorMessage]="'Le montant doit etre superieur a 0'"
    >
      <input id="montant" type="number" formControlName="montant" step="0.01" min="0.01" />
    </app-form-field>
  </div>

  @if (!isEditing()) {
    <div class="recurring-toggle">
      <label class="recurring-toggle__label" for="isRecurring">
        <input
          id="isRecurring"
          type="checkbox"
          formControlName="isRecurring"
          class="recurring-toggle__checkbox"
        />
        <span class="recurring-toggle__track"></span>
        <span class="recurring-toggle__text">Transaction récurrente</span>
      </label>
    </div>
  }

  @if (form.get('isRecurring')?.value) {
    <app-form-field label="Fréquence" fieldId="frequency">
      <app-select-picker
        formControlName="frequency"
        [items]="frequencyOptions"
        placeholder="Sélectionner une fréquence"
        [clearable]="false"
      />
    </app-form-field>

    <app-form-field
      label="Prochaine occurrence"
      fieldId="nextOccurrence"
      [showError]="isInvalid('nextOccurrence')"
      [errorMessage]="'Date requise'"
    >
      <input id="nextOccurrence" type="date" formControlName="nextOccurrence" [min]="today" />
    </app-form-field>
  } @else {
    <app-form-field
      label="Date"
      fieldId="date"
      [showError]="isInvalid('date')"
      [errorMessage]="'Date requise'"
    >
      <input id="date" type="date" formControlName="date" />
    </app-form-field>
  }

  @if (hasAccounts()) {
    <app-form-field label="Compte" fieldId="accountId">
      <app-select-picker
        formControlName="accountId"
        [items]="accountItems()"
        placeholder="Selectionner un compte"
        [clearable]="!isEditing() || !!form.get('accountId')?.value"
      />
    </app-form-field>
  } @else if (!isEditing()) {
    <div class="form-info">Créez un compte dans les paramètres pour associer vos transactions</div>
  }

  <app-form-field label="Categorie" fieldId="categoryId">
    <app-category-picker formControlName="categoryId" />
  </app-form-field>

  <app-form-field
    label="Note"
    fieldId="note"
    [showError]="isInvalid('note')"
    [errorMessage]="'500 caracteres maximum'"
  >
    <textarea id="note" formControlName="note" rows="2"></textarea>
  </app-form-field>

  <div class="form-actions">
    @if (isEditing()) {
      <button type="button" class="btn-danger" (click)="onDelete()">Supprimer</button>
    }
    <button type="button" class="btn-outline" (click)="onCancel()">Annuler</button>
    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Enregistrement...' : isEditing() ? 'Modifier' : 'Enregistrer' }}
    </button>
  </div>
</form>
