@if (isOpen()) {
  <div
    class="dacd-overlay"
    (click)="onOverlayClick()"
    role="presentation"
  >
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
    <div
      class="dacd-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dacd-title"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (click)="$event.stopPropagation()"
    >
      <div class="dacd-header">
        <ng-icon name="phosphorWarning" size="18" class="dacd-header__icon" />
        <h2 id="dacd-title" class="dacd-title">{{ 'users.action.deleteAccount' | transloco }}</h2>
        <button
          type="button"
          class="dacd-close"
          (click)="onCancel()"
          [attr.aria-label]="'common.action.close' | transloco"
          [disabled]="isSubmitting()"
        >
          <ng-icon name="phosphorX" size="16" />
        </button>
      </div>

      <p class="dacd-warning" [innerHTML]="'users.dialog.deleteAccountMessage' | transloco"></p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="dacd-form">
        <!-- Current password -->
        <div class="dacd-field">
          <label for="dacd-password" class="dacd-label">{{ 'users.form.currentPassword' | transloco }}</label>
          <div class="dacd-input-wrap">
            <input
              id="dacd-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="currentPassword"
              class="dacd-input"
              [class.dacd-input--error]="form.controls.currentPassword.touched && form.controls.currentPassword.invalid"
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="dacd-eye-btn"
              (click)="togglePassword()"
              [attr.aria-label]="(showPassword() ? 'common.action.hidePasswordAria' : 'common.action.showPasswordAria') | transloco"
            >
              <ng-icon [name]="showPassword() ? 'phosphorEyeSlash' : 'phosphorEye'" size="16" />
            </button>
          </div>
          @if (form.controls.currentPassword.touched && form.controls.currentPassword.hasError('required')) {
            <span class="dacd-error">{{ 'common.validation.required' | transloco }}</span>
          }
        </div>

        <!-- Confirmation checkbox -->
        <div class="dacd-field dacd-field--checkbox">
          <label class="dacd-checkbox-label">
            <input
              type="checkbox"
              formControlName="confirmed"
              class="dacd-checkbox"
            />
            <span>{{ 'users.form.deleteAccountConfirm' | transloco }}</span>
          </label>
        </div>

        @if (errorMessage()) {
          <div class="dacd-alert" role="alert">{{ errorMessage() }}</div>
        }

        <div class="dacd-actions">
          <button
            type="button"
            class="dacd-btn dacd-btn--ghost"
            (click)="onCancel()"
            [disabled]="isSubmitting()"
          >
            {{ 'common.action.cancel' | transloco }}
          </button>
          <button
            type="submit"
            class="dacd-btn dacd-btn--danger"
            [disabled]="isSubmitDisabled"
          >
            {{ (isSubmitting() ? 'users.feedback.deletingAccount' : 'users.action.deleteAccount') | transloco }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
