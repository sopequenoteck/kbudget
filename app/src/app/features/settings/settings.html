<h2 class="settings-title">Paramètres</h2>

@for (group of groups; track group) {
  <section class="settings-group">
    <h3 class="settings-group__title">{{ groupLabels[group] }}</h3>
    <nav class="settings-group__list">
      @for (section of groupedSections()[group]; track section.id) {
        @if (section.status === 'active') {
          <a class="settings-card" [routerLink]="section.route">
            <span class="settings-card__icon" [style.background]="section.iconColor + '1a'">
              <ng-icon [name]="section.icon" size="24" [style.color]="section.iconColor" />
            </span>
            <div class="settings-card__content">
              <span class="settings-card__title">{{ section.title }}</span>
              <span class="settings-card__description">{{ section.description }}</span>
            </div>
            <span class="settings-card__arrow">&#9654;</span>
          </a>
        } @else {
          <a class="settings-card settings-card--placeholder" [routerLink]="section.route">
            <span class="settings-card__icon" [style.background]="section.iconColor + '1a'">
              <ng-icon [name]="section.icon" size="24" [style.color]="section.iconColor" />
            </span>
            <div class="settings-card__content">
              <span class="settings-card__title">{{ section.title }}</span>
              <span class="settings-card__description">{{ section.description }}</span>
            </div>
            <span class="settings-card__badge">À venir</span>
            <span class="settings-card__arrow">&#9654;</span>
          </a>
        }
      }
    </nav>
  </section>
}
