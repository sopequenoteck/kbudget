<h2 class="settings-title">Paramètres</h2>

<nav class="settings-grid">
  @for (section of sections; track section.id) {
    <a class="settings-card" [routerLink]="section.route">
      <span class="settings-card__icon"><ng-icon [name]="section.icon" size="24" /></span>
      <div class="settings-card__content">
        <span class="settings-card__title">{{ section.title }}</span>
        <span class="settings-card__description">{{ section.description }}</span>
      </div>
      @if (section.status === 'placeholder') {
        <span class="settings-card__badge">À venir</span>
      }
      <span class="settings-card__arrow">&#9654;</span>
    </a>
  }
</nav>
