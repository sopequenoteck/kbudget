@for (group of groups; track group) {
  <section class="settings-group">
    <h3 class="settings-group__label">{{ groupLabels[group] }}</h3>
    <div class="settings-group__container">
      @for (section of groupedSections()[group]; track section.id) {
        <a class="settings-row" [class.settings-row--placeholder]="section.status !== 'active'" [routerLink]="section.route">
          <span class="settings-row__icon" [style.background]="section.iconColor + '26'" [style.color]="section.iconColor">
            <ng-icon [name]="section.icon" size="20" />
          </span>
          <div class="settings-row__content">
            <span class="settings-row__title">{{ section.title }}</span>
            <span class="settings-row__description">{{ section.description }}</span>
          </div>
          @if (section.status !== 'active') {
            <span class="settings-row__badge">À venir</span>
          }
          <span class="settings-row__chevron">›</span>
        </a>
      }
    </div>
  </section>
}
