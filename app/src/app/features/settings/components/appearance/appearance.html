<a class="section-back" routerLink="/settings">
  <span class="section-back__arrow">&#9664;</span>
  <span>Paramètres</span>
</a>

<h2 class="appearance-title">Apparence</h2>

<div class="theme-section">
  <h3 class="theme-section__label">Thème</h3>
  <div class="segmented-control">
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTheme() === 'light'"
      (click)="setTheme('light')"
    >
      Clair
    </button>
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTheme() === 'dark'"
      (click)="setTheme('dark')"
    >
      Sombre
    </button>
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTheme() === 'auto'"
      (click)="setTheme('auto')"
    >
      Automatique
    </button>
  </div>
</div>

<div class="theme-section">
  <h3 class="theme-section__label">Taille du texte</h3>
  <div class="segmented-control">
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTextScale() === 'small'"
      (click)="setTextScale('small')"
    >
      Petit
    </button>
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTextScale() === 'medium'"
      (click)="setTextScale('medium')"
    >
      Normal
    </button>
    <button
      class="segmented-control__option"
      [class.segmented-control__option--active]="currentTextScale() === 'large'"
      (click)="setTextScale('large')"
    >
      Grand
    </button>
  </div>
  <div class="text-preview" [style.fontSize.%]="textScaleService.scaleFactor() * 100">
    Voici un aperçu de la taille du texte choisie.
  </div>
</div>
