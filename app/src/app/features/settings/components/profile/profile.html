<a class="section-back" routerLink="/settings">
  <span class="section-back__arrow">&#9664;</span>
  <span>Paramètres</span>
</a>

<h2 class="profile-title">Profil</h2>

@if (currentUser(); as user) {
  <div class="profile-card">
    <div class="profile-field">
      <span class="profile-field__label">Nom</span>
      <span class="profile-field__value">{{ user.name }}</span>
    </div>
    <div class="profile-field">
      <span class="profile-field__label">Email</span>
      <span class="profile-field__value">{{ user.email }}</span>
    </div>
  </div>

  <h3 class="profile-subtitle">Preferences</h3>
  <div class="profile-card">
    <div class="profile-field">
      <span class="profile-field__label">Devise par defaut</span>
      <app-select-picker
        [formControl]="currencyControl"
        [items]="currencyItems()"
        placeholder="Choisir une devise"
      />
    </div>
  </div>
} @else {
  <div class="state-error">
    <p>Impossible de charger les informations du profil</p>
  </div>
}
