<app-auth-shell [title]="titleKey() | transloco" [tagline]="'compatibility.page.tagline' | transloco">
  <div class="incompatible">
    @if (isClientTooOld()) {
      <p class="incompatible__text">
        <span [innerHTML]="'compatibility.page.clientTooOldMessage' | transloco: { requiredVersion: requiredVersion() }"></span>
        @if (currentVersion()) {
          <span [innerHTML]="'compatibility.page.clientTooOldCurrentVersionMessage' | transloco: { currentVersion: currentVersion() }"></span>
        }
      </p>
      <p class="incompatible__hint">
        {{ 'compatibility.page.clientTooOldHint' | transloco }}
      </p>
    } @else {
      <p class="incompatible__text">
        @if (currentVersion()) {
          <span [innerHTML]="'compatibility.page.serverVersionMessage' | transloco: { currentVersion: currentVersion() }"></span>
        } @else {
          <span>{{ 'compatibility.page.serverVersionUnknownMessage' | transloco }}</span>
        }
        <span [innerHTML]="'compatibility.page.requiredVersionMessage' | transloco: { requiredVersion: requiredVersion() }"></span>
      </p>
      <p class="incompatible__hint">
        {{ 'compatibility.page.serverTooOldHint' | transloco }}
      </p>
    }

    <button type="button" class="btn-primary incompatible__retry" (click)="retry()">
      {{ 'common.action.retry' | transloco }}
    </button>
  </div>
</app-auth-shell>
