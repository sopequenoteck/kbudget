<form [formGroup]="form" (ngSubmit)="onSubmit()" class="subscription-form">
  <div class="form-row form-row--name-amount">
    <app-form-field
      label="Nom"
      fieldId="nom"
      [showError]="isInvalid('nom')"
      [errorMessage]="
        form.get('nom')?.hasError('required') ? 'Nom requis' : '255 caracteres maximum'
      "
    >
      <input id="nom" type="text" formControlName="nom" />
    </app-form-field>

    <app-form-field
      label="Montant"
      fieldId="montant"
      [showError]="isInvalid('montant')"
      [errorMessage]="'Le montant doit etre superieur a 0'"
    >
      <input id="montant" type="number" formControlName="montant" step="0.01" min="0.01" />
    </app-form-field>
  </div>

  <div class="form-row">
    <app-form-field
      label="Date de debut"
      fieldId="dateDebut"
      [showError]="isInvalid('dateDebut')"
      [errorMessage]="'Date de debut requise'"
    >
      <input id="dateDebut" type="date" formControlName="dateDebut" />
    </app-form-field>

    <app-form-field label="Categorie" fieldId="categoryId">
      <app-category-picker formControlName="categoryId" />
    </app-form-field>
  </div>

  @if (activeAccounts().length > 0) {
    <app-form-field label="Compte (optionnel)" fieldId="accountId">
      <app-select-picker
        formControlName="accountId"
        [items]="accountItems()"
        placeholder="Aucun compte"
        [clearable]="true"
      />
    </app-form-field>
  }

  @if (showCurrencyPicker()) {
    <app-form-field label="Devise (optionnel)" fieldId="currency">
      <app-select-picker
        formControlName="currency"
        [items]="currencyItems()"
        placeholder="Devise par défaut"
        [clearable]="true"
      />
    </app-form-field>
  }

  <label class="checkbox-field">
    <input type="checkbox" formControlName="actif" />
    Abonnement actif
  </label>

  <div class="form-actions">
    @if (isEditMode()) {
      <button type="button" class="btn-danger" (click)="onDelete()">Supprimer</button>
    }
    <button type="button" class="btn-outline" (click)="onCancel()">Annuler</button>
    <button type="submit" class="btn-primary">
      {{ isEditMode() ? 'Modifier' : 'Enregistrer' }}
    </button>
  </div>
</form>
