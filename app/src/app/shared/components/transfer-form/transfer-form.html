@if (!hasEnoughAccounts()) {
  <div class="transfer-form__no-accounts">
    <p>{{ 'transactions.empty.notEnoughAccounts' | transloco }}</p>
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="transfer-form">
    <app-form-field
      [label]="'transactions.form.transferFrom' | transloco"
      fieldId="fromAccountId"
      [showError]="isInvalid('fromAccountId')"
      [errorMessage]="'transactions.form.transferFromRequired' | transloco"
    >
      <app-select-picker
        formControlName="fromAccountId"
        [items]="accountItems()"
        [placeholder]="'transactions.form.transferFromPlaceholder' | transloco"
        [clearable]="false"
      />
    </app-form-field>

    <app-form-field
      [label]="'transactions.form.transferTo' | transloco"
      fieldId="toAccountId"
      [showError]="isInvalid('toAccountId')"
      [errorMessage]="'transactions.form.transferToRequired' | transloco"
    >
      <app-select-picker
        formControlName="toAccountId"
        [items]="accountItems()"
        [placeholder]="'transactions.form.transferToPlaceholder' | transloco"
        [clearable]="false"
      />
    </app-form-field>

    @if (form.hasError('sameAccount') && form.get('toAccountId')?.touched) {
      <div class="form-error-banner">{{ 'transactions.form.transferAccountsMismatch' | transloco }}</div>
    }

    <app-form-field
      [label]="'transactions.form.amount' | transloco"
      fieldId="transferMontant"
      [showError]="isInvalid('montant')"
      [errorMessage]="'transactions.form.amountInvalid' | transloco"
    >
      <input id="transferMontant" type="number" formControlName="montant" step="0.01" min="0.01" />
    </app-form-field>

    <app-form-field
      [label]="'transactions.form.note' | transloco"
      fieldId="transferNote"
      [showError]="isInvalid('note')"
      [errorMessage]="'common.validation.maxLength' | transloco: { max: 500 }"
    >
      <textarea id="transferNote" formControlName="note" rows="2"></textarea>
    </app-form-field>

    @if (errorMessage()) {
      <div class="form-error-banner">{{ errorMessage() }}</div>
    }

    <div class="form-actions">
      <button type="button" class="btn-outline" (click)="onCancel()">{{ 'common.action.cancel' | transloco }}</button>
      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? ('transactions.feedback.transferring' | transloco) : ('transactions.action.transferSubmit' | transloco) }}
      </button>
    </div>
  </form>
}
