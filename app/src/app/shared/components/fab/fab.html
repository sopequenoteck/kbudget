@if (!isHidden()) {
  @if (isOpen()) {
    <div class="speed-dial-overlay" (click)="onToggle()" role="none" tabindex="-1"></div>
    <div class="speed-dial-menu" role="menu" tabindex="-1" (keydown)="onMenuKeydown($event)">
      @for (item of actions(); track item.type) {
        <button
          #menuItem
          type="button"
          class="speed-dial-item"
          role="menuitem"
          (click)="onAction(item.type)"
        >
          <span class="speed-dial-label">{{ item.labelKey | transloco }}</span>
          <span class="speed-dial-icon"><ng-icon [name]="item.icon" size="18" /></span>
        </button>
      }
    </div>
  }

  <button
    #fabButton
    type="button"
    class="fab-button"
    [class.open]="isOpen()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="'common.action.quickActionsAria' | transloco"
    (click)="onToggle()"
  >
    <span class="fab-icon"><ng-icon name="phosphorPlusBold" size="24" /></span>
  </button>
}
