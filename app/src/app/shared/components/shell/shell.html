<header class="shell-header">
  <button class="shell-hamburger" (click)="toggleSidebar()" aria-label="Menu">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>
  <h1 class="shell-logo">Budget</h1>
  @if (userName()) {
    <span class="shell-user">{{ userName()!.name }}</span>
  }
</header>

@if (sidebarOpen()) {
  <div
    class="shell-backdrop"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="presentation"
  ></div>
}

<nav class="shell-sidebar" [class.open]="sidebarOpen()">
  <a routerLink="/dashboard" routerLinkActive="active" (click)="onNavClick()">Accueil</a>
  <a routerLink="/transactions" routerLinkActive="active" (click)="onNavClick()">Transactions</a>
  <a routerLink="/subscriptions" routerLinkActive="active" (click)="onNavClick()">Abonnements</a>
  <a routerLink="/debts" routerLinkActive="active" (click)="onNavClick()">Dettes</a>
  <a
    class="shell-logout"
    tabindex="0"
    role="button"
    (click)="onLogout()"
    (keydown.enter)="onLogout()"
    >Déconnexion</a
  >
</nav>

<main class="shell-content">
  <router-outlet />
</main>

<app-fab
  [isOpen]="speedDialOpen()"
  [isHidden]="modalService.modalOpen()"
  (toggled)="onFabToggle()"
  (actionSelected)="onSpeedDialAction($event)"
/>

<app-modal [isOpen]="modalService.modalOpen()" [title]="modalService.modalTitle()" (closed)="onModalClose()">
  @switch (modalService.activeModal()) {
    @case ('transaction') {
      <app-transaction-form
        [transaction]="$any(modalService.editingEntity())"
        (saved)="onTransactionSaved($event)"
        (cancelled)="onModalClose()"
        (deleted)="onTransactionDeleted($event)"
      />
    }
    @case ('subscription') {
      <app-subscription-form
        [subscription]="$any(modalService.editingEntity())"
        (saved)="onSubscriptionSaved($event)"
        (cancelled)="onModalClose()"
        (deleted)="onSubscriptionDeleted($event)"
      />
    }
    @case ('debt') {
      <app-debt-form
        [debt]="$any(modalService.editingEntity())"
        (saved)="onDebtSaved($event)"
        (cancelled)="onModalClose()"
        (deleted)="onDebtDeleted($event)"
      />
    }
  }
</app-modal>
