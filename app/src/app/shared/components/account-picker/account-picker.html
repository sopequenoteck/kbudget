<div class="account-picker">
  <span class="account-picker__label">{{ label() }}</span>

  <div class="account-picker__list">
    @if (!required()) {
      <button
        type="button"
        class="account-picker__item"
        [class.active]="selectedAccountId() === null"
        (click)="onSelect(null)"
      >
        <span class="account-picker__icon">—</span>
        <span class="account-picker__name">Aucun</span>
      </button>
    }

    @for (account of accounts(); track account.id) {
      <button
        type="button"
        class="account-picker__item"
        [class.active]="selectedAccountId() === account.id"
        [style.border-color]="selectedAccountId() === account.id ? account.couleur : 'transparent'"
        (click)="onSelect(account.id)"
      >
        <span class="account-picker__icon">{{ account.icone }}</span>
        <span class="account-picker__name">{{ account.nom }}</span>
        <span class="account-picker__solde" [class.negative]="account.solde < 0">
          {{ account.solde | number: '1.2-2' }} &euro;
        </span>
      </button>
    }
  </div>

  @if (accounts().length === 0) {
    <div class="account-picker__empty">Aucun compte disponible</div>
  }
</div>
