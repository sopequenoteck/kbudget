<div class="emoji-input">
  <div
    class="emoji-trigger"
    (click)="open()"
    (keydown.enter)="open()"
    (keydown.space)="open()"
    role="button"
    tabindex="0"
    aria-label="Choisir un emoji"
  >
    {{ value() || '...' }}
  </div>

  @if (isOpen()) {
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events,@angular-eslint/template/interactive-supports-focus -->
    <div class="picker-backdrop" (click)="onBackdropClick($event)"></div>
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events,@angular-eslint/template/interactive-supports-focus -->
    <div class="picker-popover" (click)="$event.stopPropagation()"></div>
  }
</div>
