<div class="emoji-input">
  <div
    class="emoji-trigger"
    (click)="open()"
    (keydown.enter)="open()"
    (keydown.space)="open()"
    role="button"
    tabindex="0"
    aria-label="Choisir un emoji"
  >
    {{ value() || '...' }}
  </div>

  @if (isOpen()) {
    <div class="picker-backdrop" (click)="onBackdropClick($event)"></div>
    <div class="picker-popover" (click)="$event.stopPropagation()"></div>
  }
</div>
