<div class="category-picker" [class.disabled]="disabled()">
  <app-select-picker
    [items]="categoryItems()"
    [searchable]="true"
    [clearable]="true"
    searchPlaceholder="Rechercher une categorie..."
    emptyMessage="Aucune categorie"
    placeholder="Selectionner"
    [ngModel]="selectedCategoryId()"
    (ngModelChange)="onPickerChange($event)"
    (searchTermChange)="onSearchTermChange($event)"
  />

  @if (!hasExactMatch() && searchTerm()) {
    <button
      type="button"
      class="category-picker__create"
      (click)="openCreateModal()"
    >
      + Créer "{{ searchTerm() }}"
    </button>
  }
</div>

<app-modal
  [isOpen]="showCreateModal()"
  title="Nouvelle categorie"
  (closed)="onCreateCancelled()"
>
  <app-category-form
    [initialName]="searchTerm()"
    (saved)="onCategorySaved($event)"
    (cancelled)="onCreateCancelled()"
  />
</app-modal>
