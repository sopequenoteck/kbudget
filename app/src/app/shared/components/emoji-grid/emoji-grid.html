<div class="emoji-grid" role="radiogroup" aria-label="Choisir un emoji">
  @for (emoji of emojis; track emoji) {
    <button
      type="button"
      class="emoji-grid__item"
      [class.active]="selected() === emoji"
      [attr.aria-checked]="selected() === emoji"
      role="radio"
      (click)="onSelect(emoji)"
    >
      {{ emoji }}
    </button>
  }
</div>
