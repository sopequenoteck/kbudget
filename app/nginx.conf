server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep API requests ahead of the generic asset regex below. In particular,
    # bank logo URLs end in .svg but must be served by the API container.
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Enrichit la chaine plutot que de l'ecraser : ce nginx est un maillon
        # interne, derriere le reverse proxy de bordure (Caddy) qui a deja
        # pose l'IP reelle du client. L'ecraser ici la remplacerait par
        # l'adresse de Caddy (KKS-310).
        #
        # Si ce container est expose directement sur Internet, sans proxy
        # devant, passer a $remote_addr — sinon un client peut forger le
        # premier maillon et contourner la limitation de debit.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers SANS empreinte, en correspondance EXACTE. La forme « = » n'est pas un choix de style :
    # nginx resout les location par PRIORITE et non par ordre d'ecriture, et une correspondance
    # exacte l'emporte sur toute expression reguliere. Ces fichiers echappent donc a la regle des
    # fichiers a empreinte ci-dessous quel que soit l'ordre des lignes.
    #
    # « always » est indispensable : sans lui nginx n'emet pas l'en-tete sur les reponses 304,
    # precisement celles que produit une revalidation no-cache.
    #
    # C'est cette regle qui fait de /ngsw-worker.js le CANAL DE CORRECTION A DISTANCE : un retour
    # arriere d'image n'atteint pas un service worker deja installe dans un navigateur, et le remede
    # (safety-worker.js, docs/deployment.md) n'est atteignable que si ce fichier est revalide a
    # chaque verification du navigateur, jamais fige dans un cache HTTP ou intermediaire.
    #
    # no-transform (KKS-436) : sans lui, Cloudflare peut injecter dans le HTML un script de
    # detection des robots, dont les parametres changent a chaque requete. L'empreinte d'index.html
    # ne correspond alors jamais a celle de ngsw.json, et le service worker Angular rejette TOUTE
    # mise a jour : la PWA reste figee sur la version en cache.
    #
    # Attention, add_header est une directive de type tableau : une seule declaration dans une
    # location annule tout l'heritage du niveau superieur. Aucune directive n'est posee au niveau
    # server aujourd'hui ; la premiere qui le serait y disparaitrait en silence des location
    # ci-dessous.
    location = /index.html {
        add_header Cache-Control "no-cache, no-transform" always;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Worker de secours d'Angular, publie par le build. Son nom ne porte pas d'empreinte et son
    # contenu suit la version d'Angular : no-cache, comme tout fichier sans empreinte. Le navigateur
    # ne le charge jamais de lui-meme ; la procedure d'urgence en copie le contenu a l'URL de
    # /ngsw-worker.js depuis le disque du conteneur, ce que le cache HTTP ne change pas.
    location = /safety-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    # Fichiers A EMPREINTE du build (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css,
    # media/) : leur nom change a chaque contenu, le cache peut etre long. L'empreinte de huit
    # caracteres majuscules est celle de `outputHashing: all` ; la regle est volontairement
    # etroite (et entre guillemets : nginx lirait « {8} » comme un bloc) : un fichier qui n'en porte pas (icones, favicon, catalogues i18n) ne doit jamais
    # devenir immutable.
    location ~ "^/[^/]+-[A-Z0-9]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Repli : le reste du build, sans empreinte (icones, favicon, i18n), revalide a chaque usage, et
    # la navigation SPA. try_files produit une redirection INTERNE : la requete est reevaluee et
    # tombe sur « location = /index.html », donc le no-cache, no-transform s'applique aussi a la
    # racine et aux routes de l'application.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
