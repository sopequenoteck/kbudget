sonar.projectKey=kbudget-app
sonar.projectName=kbudget-app
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/dist/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Recalcule le blame git de tous les fichiers a chaque analyse. Le nouveau
# code « Clean as You Code » est determine ligne a ligne par ce blame, et
# Sonar ne le recalcule par defaut que pour les fichiers dont le contenu a
# change depuis l'analyse precedente. Or toutes les analyses (PR, develop,
# main) ecrasent ce meme projet : un fichier identique mais d'historique
# different garderait le blame d'une autre branche (constate sur KKS-373,
# PR #22 notee sur le blame de la #18).
sonar.scm.forceReloadAll=true
