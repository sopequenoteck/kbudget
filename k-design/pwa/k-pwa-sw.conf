# K Design v0.7.1 — copié par scripts/build.mjs depuis pwa/. Ne pas éditer.
# Règles de cache du service worker Angular, communes aux PWA K (K·Budget, K-Review, KPanel).
# Fragment de blocs « location » : à inclure dans le bloc « server » de l'app, pas dans un « location » :
#
#   include /etc/nginx/k-pwa-sw.conf;     # chemin où le Dockerfile de l'app copie ce fichier
#
# Pourquoi ces règles (KKS-436, KKS-446, KKS-493) :
#   - /index.html en « no-cache, no-transform » : Cloudflare injecte dans le HTML un script de détection
#     des robots dont le contenu change à chaque réponse. L'empreinte d'index.html ne correspond alors
#     jamais à celle de ngsw.json et le service worker Angular rejette toute mise à jour. « no-transform »
#     interdit cette réécriture ; « no-cache » force la revalidation.
#   - /ngsw-worker.js, /ngsw.json, /manifest.webmanifest, /safety-worker.js en « no-cache » : fichiers sans
#     empreinte dans leur nom. Sans revalidation à chaque chargement, un correctif n'atteint jamais un
#     navigateur déjà installé. /safety-worker.js est le worker de secours qu'Angular publie à chaque build.
#
# Piège : « add_header » est tout ou rien par niveau. Dès qu'un « location » pose un add_header, il n'hérite
# plus d'AUCUN de ceux du niveau « server » (en-têtes de sécurité compris). Une app qui en pose au niveau
# « server » les perd donc sur ces cinq chemins : à arbitrer chez elle (les répéter dans ces blocs, ou
# déplacer ses en-têtes de sécurité dans un fichier inclus de chaque côté).
#
# Complément hors code : une Cache Rule Cloudflare (Bypass cache sur les scripts du service worker),
# posée à la main dans le tableau de bord. Voir README.md.
#
# Restent dans le nginx de l'app : « = /custom-sw.js » (script de Web Push de K-Review), le cache long
# des fichiers à empreinte, « /api/ » et le repli vers index.html.

location = /index.html {
    add_header Cache-Control "no-cache, no-transform" always;
}

location = /ngsw-worker.js {
    add_header Cache-Control "no-cache" always;
}

location = /ngsw.json {
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
}

location = /safety-worker.js {
    add_header Cache-Control "no-cache" always;
}
