# Remplacer budget.example.com par votre domaine
# Certificats SSL via certbot : certbot --nginx -d budget.example.com

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name budget.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name budget.example.com;

    # Certificats Let's Encrypt (generes par certbot)
    ssl_certificate     /etc/letsencrypt/live/budget.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1m;

    # Rate limiting sur l'authentification.
    # Le chemin porte la version de l'API (KKS-313) : sans /v1, ce bloc cesse
    # de matcher et la protection contre le bruteforce disparait sans erreur.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://localhost:8080;
        include proxy_params;
    }

    location / {
        proxy_pass http://localhost:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
