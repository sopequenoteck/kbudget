# Watchtower — deploiement continu sur la VM de TEST.
#
# NE PAS RECOMMANDER AUX SELF-HOSTERS (KKS-321). Une mise a jour automatique
# peut appliquer une migration Flyway a trois heures du matin, sans personne
# pour lire l'erreur. Chez quelqu'un dont on ne connait ni la base ni les
# sauvegardes, cela produit un incident indiagnostiquable.
#
# Acceptable ici parce que c'est une VM de test, surveillee par la personne qui
# l'exploite. La documentation destinee a la communaute privilegie la mise a
# jour manuelle avec sauvegarde prealable — voir docs/deployment.md.
#
# Surveille les images `:latest` publiees par `.github/workflows/release.yml`
# au merge vers main, et recree les conteneurs k-budget.

services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300          # vérifie les images toutes les 5 min
      WATCHTOWER_CLEANUP: "true"             # purge les anciennes images après update
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    restart: unless-stopped
