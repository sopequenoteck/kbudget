spring:
  application:
    name: k-budget-api
  profiles:
    default: prod

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    access-expiration: 900000
    refresh-expiration: 2592000000
  admin-emails: ${ADMIN_EMAILS:}
  bootstrap:
    email: ${BOOTSTRAP_EMAIL:admin@localhost}
  meta:
    # Version de client la plus ancienne acceptee, exposee par /api/meta (KKS-314).
    # Ne bouge qu'a une rupture de contrat, pas a chaque release.
    min-client-version: ${MIN_CLIENT_VERSION:6.0.0}
  storage:
    avatars:
      path: ${AVATAR_STORAGE_PATH:./data/avatars}

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

# Documentation OpenAPI desactivee par defaut : elle publierait la surface
# d'API complete de chaque instance self-hostee sans benefice en production.
# Reactivable volontairement via SWAGGER_ENABLED=true (utile pour developper
# un client tiers contre son instance).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

---
# Profil dev : Swagger actif par defaut. L'activation vit ici plutot que dans
# application-dev.yaml, qui n'est pas versionne (cf. .gitignore) et n'existe
# donc pas chez un contributeur qui vient de cloner le depot.
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
