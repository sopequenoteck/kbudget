spring:
  application:
    name: budget-api
  profiles:
    default: prod

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    access-expiration: 900000
    refresh-expiration: 2592000000

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
