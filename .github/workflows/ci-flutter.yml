name: CI - Flutter

# Analyse qualité + couverture de la stack Flutter (plugin sonar-flutter côté serveur).
#
# Gate qualité : Quality Gate "Clean as You Code" (new code only) côté Sonar.
#   - pull_request → BLOQUANT dans le run (sonar.qualitygate.wait=true) : le check
#                    apparaît ROUGE sur la PR si le new code régresse.
#                    Barrière HUMAINE au merge (pas de required check strict).
#   - push (merge) → scan de référence non bloquant, alimente le dashboard Sonar.
#
# PRÉREQUIS INFRA (hors repo) :
#   - Runner self-hosted labellisé [self-hosted, kbudget-ci] sur VM 105,
#     avec accès au réseau Docker ci-stack_ci-net (pour joindre SonarQube).
#   - Repo PRIVÉ. Settings → Actions → "Require approval for all external
#     contributors" : le runner a le socket Docker, ne jamais exécuter de code
#     de fork non approuvé (risque RCE sur l'infra homelab).
#   - Secret repo SONAR_TOKEN, variable repo SONAR_HOST_URL (ex http://sonarqube:9000).
#   - Plugin sonar-flutter installé sur le serveur SonarQube (analyse Dart).

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'flutter/**'
      - '.github/workflows/ci-flutter.yml'
  push:
    branches: [main, develop]
    paths:
      - 'flutter/**'
      - '.github/workflows/ci-flutter.yml'

# Annule un run PR obsolète si un nouveau commit arrive sur la même PR.
# Sur push (merge), on NE PAS annule : on préserve les scans de référence.
concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter-analysis:
    name: Analyse Flutter
    runs-on: [self-hosted, kbudget-ci]
    timeout-minutes: 20
    container:
      # Version épinglée, alignée sur le SDK de développement (Flutter 3.41.2 /
      # Dart 3.11.0, la contrainte `sdk: ^3.11.0` du pubspec).
      #
      # `:stable` a glissé sous le projet : la CI a fini par tourner sur un SDK
      # où `IconData` est devenue une `final class`, que `phosphor_flutter 2.1.0`
      # étend. 68 tests ne compilaient plus, sur `develop` comme sur `main`, sans
      # qu'aucun commit du projet en soit la cause. Le check est resté rouge de
      # juin à septembre 2026, devenant incapable de signaler une vraie
      # régression.
      #
      # Monter de SDK est un choix délibéré : changer ce tag, vérifier que les
      # dépendances suivent, puis aligner les postes de développement.
      image: ghcr.io/cirruslabs/flutter:3.41.2
      options: --network ci-stack_ci-net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar : blame / détection du new code

      - name: Dépendances + code generation
        working-directory: flutter
        # .g.dart / .freezed.dart gitignorés : régénérés dans le checkout CI.
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Tests + couverture
        working-directory: flutter
        run: flutter test --coverage

      - name: Installer sonar-scanner CLI
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl unzip
          curl -sSLo /tmp/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/sonar-scanner.zip -d /opt
          echo "/opt/sonar-scanner-6.2.1.4610-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Scan Sonar
        working-directory: flutter
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # projectKey, sources, exclusions, chemin lcov : flutter/sonar-project.properties
        run: |
          sonar-scanner \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

  # Job separe, sur runner GitHub : la conformite de licence doit se verifier
  # partout, y compris sur une pull request de fork — qui n'a pas acces au
  # runner self-hosted.
  licence-headers:
    name: En-tetes de licence MPL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # La MPL-2.0 est un copyleft par fichier : l'en-tete est ce qui rattache
      # chaque source a la licence. Le controle existe parce que
      # `flutter gen-l10n` regenere app_localizations.dart sans lui, en
      # silence — le fichier etant versionne, l'en-tete disparaissait du depot
      # a chaque modification de traduction.
      - name: Verifier que chaque source de flutter/lib porte l'en-tete
        run: |
          missing=""
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -q "Mozilla Public"; then
              missing="${missing}  ${file}\n"
            fi
          done < <(find flutter/lib -name '*.dart' -not -name '*.g.dart' -not -name '*.freezed.dart')

          if [ -n "$missing" ]; then
            echo "::error::Des sources de flutter/lib n'ont pas l'en-tete MPL-2.0."
            printf "%b" "$missing"
            echo ""
            echo "Ajouter en tete de chaque fichier :"
            echo "  // This Source Code Form is subject to the terms of the Mozilla Public"
            echo "  // License, v. 2.0. If a copy of the MPL was not distributed with this"
            echo "  // file, You can obtain one at https://mozilla.org/MPL/2.0/."
            exit 1
          fi
          echo "Tous les fichiers de flutter/lib portent l'en-tete MPL-2.0."
