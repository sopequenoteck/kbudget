name: CI - API (Spring Boot)

# Analyse qualité + couverture de la stack API.
#
# Gate qualité : Quality Gate "Clean as You Code" (new code only) côté Sonar.
#   - pull_request → BLOQUANT dans le run (sonar.qualitygate.wait=true) : le check
#                    apparaît ROUGE sur la PR si le new code régresse.
#                    Barrière HUMAINE au merge (pas de required check strict).
#   - push (merge) → scan de référence non bloquant, alimente le dashboard Sonar.
#
# PRÉREQUIS INFRA (hors repo) :
#   - Runner self-hosted labellisé [self-hosted, kbudget-ci] sur VM 105,
#     avec accès au réseau Docker ci-stack_ci-net (pour joindre SonarQube).
#   - Dépôt PUBLIC. Settings → Actions → "Require approval for all external
#     contributors" doit rester actif : le runner a le socket Docker, exécuter
#     du code de fork non approuvé donnerait une RCE sur l'infra homelab.
#     Depuis l'ouverture du dépôt, ce réglage est la seule chose qui l'empêche.
#   - Secret repo SONAR_TOKEN, variable repo SONAR_HOST_URL (ex http://sonarqube:9000).

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'

# Annule un run PR obsolète si un nouveau commit arrive sur la même PR.
# Sur push (merge), on NE PAS annule : on préserve les scans de référence.
concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Tests sur runner GitHub : c'est le seul job de ce workflow qu'une PR de fork
  # peut executer, le self-hosted n'acceptant pas de code externe non approuve
  # (cf. PREREQUIS INFRA). Sans lui, une PR de fork touchant api/ ne declenchait
  # aucun test du tout.
  #
  # Pas de container : `setup-java` sur l'hote, comme le gate de release
  # (release.yml). Deux tests d'integration demarrent un PostgreSQL via
  # Testcontainers et ont donc besoin d'un Docker joignable.
  api-tests:
    name: Tests API (runner GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & tests (sans Sonar)
        working-directory: api
        run: mvn -B clean verify

  api-analysis:
    name: Analyse API (Spring Boot)
    runs-on: [self-hosted, kbudget-ci]
    timeout-minutes: 15
    container:
      image: maven:3.9-eclipse-temurin-21
      options: --network ci-stack_ci-net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar : blame / détection du new code

      - name: Build, tests, couverture & scan Sonar
        working-directory: api
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=kbudget-api \
            -Dsonar.projectName=kbudget-api \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
