name: Release

# Remplace tag-on-merge.yml ET docker-publish.yml (à supprimer pour éviter
# la double exécution sur push main).
#
# Gate qualité (gating dur, post-merge) : `build-and-push` dépend de `test-api`
# ET `test-app` (needs). Si un test casse, AUCUNE image n'est poussée et aucun
# tag n'est créé. C'est le seul gate possible sans branch protection (plan free) :
# `main` peut être temporairement rouge, mais la prod ne reçoit jamais de code
# dont les tests échouent. Tests sans Sonar, sur runner GitHub (pas le homelab).
#
# Ordre garanti : tests D'ABORD, build+push des images ENSUITE, tag git ENFIN.
# Le job `tag` dépend de `build-and-push` (needs) -> si le push échoue,
# aucun tag n'est créé. Un tag vX.Y.Z implique donc qu'une image :X.Y.Z existe.

on:
  push:
    branches: [main]

# Sérialise les releases : ne jamais annuler une release en cours
# (éviter une image à moitié poussée).
concurrency:
  group: release
  cancel-in-progress: false

# Moindre privilège par défaut ; le job tag réhausse ce qu'il lui faut.
permissions:
  contents: read

jobs:
  test-api:
    name: Tests API (gate release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & tests (H2, sans Sonar)
        working-directory: api
        run: mvn -B clean verify

  test-app:
    name: Tests APP (gate release)
    # Depuis KKS-312, la suite ne depend plus du nombre de coeurs du runner :
    # les hooks de nettoyage du TestBed sont installes par setupFiles, qui
    # s'execute enfin (src/test-setup.ts etait absent de tsconfig.spec.json).
    # Pas de Sonar ici -> pas besoin du reseau ci-stack_ci-net.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:22
    steps:
      - uses: actions/checkout@v4

      - name: Install, tests + couverture
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

  build-and-push:
    needs: [test-api, test-app]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessaire pour publier sur GHCR
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # QEMU : necessaire pour les instructions RUN du stage runtime arm64
      # (apt-get, useradd). Les stages de build restent natifs via BUILDPLATFORM.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR est la reference documentee (KKS-321) : le registre est lie au
      # depot, et Docker Hub applique des quotas de telechargement aux
      # utilisateurs anonymes — precisement le mode d'acces d'un self-hoster.
      # Docker Hub reste alimente en miroir.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag flottant X.Y : recoit les correctifs de la serie sans les
      # changements de fonctionnalites. Pas de tag X seul — il engloberait des
      # ajouts de features, ce qu'on ne veut pas d'un tag presente comme sur.
      - name: Compute minor tag
        id: minor
        run: echo "value=$(cut -d. -f1,2 <<< '${{ steps.version.outputs.value }}')" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          # Declare le depot source dans l'image : c'est ce label qui lie le
          # paquet GHCR au depot. Sans lui, GitHub pose la liaison au premier
          # push et elle reste celle du depot qui a publie en premier — ce qui
          # a survecu au renommage de `budget` en `kbudget` (KKS-353).
          labels: org.opencontainers.image.source=https://github.com/sopequenoteck/kbudget
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sopequenoteck/k-budget-api:latest
            ghcr.io/sopequenoteck/k-budget-api:${{ steps.version.outputs.value }}
            ghcr.io/sopequenoteck/k-budget-api:${{ steps.minor.outputs.value }}
            sopequenotech/k-budget-api:latest
            sopequenotech/k-budget-api:${{ steps.version.outputs.value }}
            sopequenotech/k-budget-api:${{ steps.minor.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push App
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          # Declare le depot source dans l'image : c'est ce label qui lie le
          # paquet GHCR au depot. Sans lui, GitHub pose la liaison au premier
          # push et elle reste celle du depot qui a publie en premier — ce qui
          # a survecu au renommage de `budget` en `kbudget` (KKS-353).
          labels: org.opencontainers.image.source=https://github.com/sopequenoteck/kbudget
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sopequenoteck/k-budget-app:latest
            ghcr.io/sopequenoteck/k-budget-app:${{ steps.version.outputs.value }}
            ghcr.io/sopequenoteck/k-budget-app:${{ steps.minor.outputs.value }}
            sopequenotech/k-budget-app:latest
            sopequenotech/k-budget-app:${{ steps.version.outputs.value }}
            sopequenotech/k-budget-app:${{ steps.minor.outputs.value }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  tag:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour pousser le tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from VERSION
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existe déjà, skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Tag ${TAG} créé et pushé."