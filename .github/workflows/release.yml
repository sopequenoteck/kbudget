name: Release

# Remplace tag-on-merge.yml ET docker-publish.yml (à supprimer pour éviter
# la double exécution sur push main).
#
# Gate qualité (gating dur, post-merge) : `build-and-push` dépend de `test-api`
# ET `test-app` (needs). Si un test casse, AUCUNE image n'est poussée et aucun
# tag n'est créé. C'est le seul gate possible sans branch protection (plan free) :
# `main` peut être temporairement rouge, mais la prod ne reçoit jamais de code
# dont les tests échouent. Tests sans Sonar, sur runner GitHub (pas le homelab).
#
# Ordre garanti : tests D'ABORD, build+push des images ENSUITE, tag git ENFIN.
# Le job `tag` dépend de `build-and-push` (needs) -> si le push échoue,
# aucun tag n'est créé. Un tag vX.Y.Z implique donc qu'une image :X.Y.Z existe.

on:
  push:
    branches: [main]

# Sérialise les releases : ne jamais annuler une release en cours
# (éviter une image à moitié poussée).
concurrency:
  group: release
  cancel-in-progress: false

# Moindre privilège par défaut ; le job tag réhausse ce qu'il lui faut.
permissions:
  contents: read

jobs:
  test-api:
    name: Tests API (gate release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & tests (H2, sans Sonar)
        working-directory: api
        run: mvn -B clean verify

  test-app:
    name: Tests APP (gate release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install & tests
        working-directory: app
        run: |
          npm ci
          npm test

  build-and-push:
    needs: [test-api, test-app]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: |
            sopequenotech/k-budget-api:latest
            sopequenotech/k-budget-api:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push App
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: |
            sopequenotech/k-budget-app:latest
            sopequenotech/k-budget-app:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  tag:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour pousser le tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from VERSION
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} existe déjà, skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Tag ${TAG} créé et pushé."