name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION was incremented
        run: |
          # Récupérer la version sur main
          MAIN_VERSION=$(git show origin/main:VERSION 2>/dev/null | tr -d '[:space:]' || echo "0.0.0")
          # Récupérer la version sur la branche PR
          PR_VERSION=$(cat VERSION | tr -d '[:space:]')

          echo "Version main  : ${MAIN_VERSION}"
          echo "Version PR    : ${PR_VERSION}"

          if [ "$MAIN_VERSION" = "$PR_VERSION" ]; then
            echo ""
            echo "ERREUR: La version n'a pas été incrémentée."
            echo "Mets à jour le fichier VERSION avant de merger dans main."
            echo "Version actuelle sur main : ${MAIN_VERSION}"
            exit 1
          fi

          # Vérifier que la nouvelle version est supérieure (comparaison semver simple)
          HIGHER=$(printf '%s\n%s' "$MAIN_VERSION" "$PR_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" != "$PR_VERSION" ]; then
            echo ""
            echo "ERREUR: La version PR (${PR_VERSION}) n'est pas supérieure à main (${MAIN_VERSION})."
            exit 1
          fi

          echo ""
          echo "OK: version incrémentée ${MAIN_VERSION} -> ${PR_VERSION}"

      - name: Check tag does not already exist
        run: |
          PR_VERSION=$(cat VERSION | tr -d '[:space:]')
          if git rev-parse "v${PR_VERSION}" >/dev/null 2>&1; then
            echo "ERREUR: Le tag v${PR_VERSION} existe déjà."
            exit 1
          fi
          echo "OK: tag v${PR_VERSION} disponible"
