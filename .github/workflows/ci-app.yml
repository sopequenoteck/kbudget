name: CI - APP (Angular)

# Analyse qualité + couverture de la stack Angular.
#
# Gate qualité : Quality Gate "Clean as You Code" (new code only) côté Sonar.
#   - pull_request → BLOQUANT dans le run (sonar.qualitygate.wait=true) : le check
#                    apparaît ROUGE sur la PR si le new code régresse.
#                    Barrière HUMAINE au merge : l'analyse n'est pas un check
#                    obligatoire, le runner self-hosted ne tournant pas pour une
#                    PR de fork non approuvée. Les jobs « runner GitHub » le sont
#                    (règles de develop et main, CONTRIBUTING.md).
#   - push (merge) → scan de référence non bloquant, alimente le dashboard Sonar.
#
# PRÉREQUIS INFRA (hors repo) :
#   - Runner self-hosted labellisé [self-hosted, kbudget-ci] sur VM 105,
#     avec accès au réseau Docker ci-stack_ci-net (pour joindre SonarQube).
#   - Dépôt PUBLIC. Settings → Actions → "Require approval for all external
#     contributors" doit rester actif : le runner a le socket Docker, exécuter
#     du code de fork non approuvé donnerait une RCE sur l'infra homelab.
#     Depuis l'ouverture du dépôt, ce réglage est la seule chose qui l'empêche.
#   - Secret repo SONAR_TOKEN, variable repo SONAR_HOST_URL (ex http://sonarqube:9000).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - '.github/workflows/ci-app.yml'

# Annule un run PR obsolète si un nouveau commit arrive sur la même PR.
# Sur push (merge), on NE PAS annule : on préserve les scans de référence.
concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fichiers de la PR : les jobs suivants sont sautés si elle ne touche pas le
  # motif (.github/actions/changed). Un job sauté satisfait un check obligatoire.
  changes:
    name: Fichiers concernés (APP)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed
        uses: ./.github/actions/changed
        with:
          pattern: '^(app/|\.github/workflows/ci-app\.yml$|\.github/actions/changed/)'

  # Tests sur runner GitHub : c'est le seul job de ce workflow qu'une PR de fork
  # peut executer, le self-hosted ayant le socket Docker (cf. PREREQUIS INFRA
  # ci-dessus). Il ne depend d'aucune infra maison, donc un contributeur externe
  # obtient un retour sur sa PR et peut reproduire l'echec en local.
  #
  # ci-api.yml et ci-flutter.yml ont chacun leur equivalent depuis KKS-358.
  app-tests:
    name: Tests APP (runner GitHub)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4

      - name: Install + tests
        working-directory: app
        run: |
          npm ci
          npm test

  app-analysis:
    name: Analyse APP (Angular)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: [self-hosted, kbudget-ci]
    timeout-minutes: 15
    container:
      image: node:24
      options: --network ci-stack_ci-net
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar : blame / détection du new code

      - name: Install, tests + couverture
        working-directory: app
        run: |
          npm ci
          npm run test:coverage

      - name: Scan Sonar
        working-directory: app
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # projectKey, sources, exclusions, chemin lcov : app/sonar-project.properties
        run: |
          npx --yes @sonar/scan \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
