openapi: 3.0.3
info:
  title: Adjust Balance Endpoint
  version: 1.0.0

paths:
  /api/accounts/{id}/adjust-balance:
    post:
      summary: Ajuster le solde d'un compte bancaire
      description: |
        Calcule la différence entre le solde actuel du compte et le nouveau solde souhaité,
        puis crée une transaction de type AJUSTEMENT pour combler l'écart.
        Aucune transaction n'est créée si le nouveau solde est identique au solde actuel.
      operationId: adjustBalance
      tags:
        - Comptes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID du compte à ajuster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustBalanceRequest'
            examples:
              hausse:
                summary: Ajustement à la hausse
                value:
                  newBalance: 750.00
              baisse:
                summary: Ajustement à la baisse
                value:
                  newBalance: 300.00
      responses:
        '200':
          description: |
            Solde ajusté avec succès. Si le nouveau solde est identique au solde actuel,
            aucune transaction n'est créée mais le compte est retourné normalement (HTTP 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Requête invalide (newBalance null ou compte inactif)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                inactive:
                  value:
                    status: 400
                    message: "Impossible d'ajuster le solde d'un compte inactif"
        '404':
          description: Compte non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/transactions:
    post:
      summary: Créer une transaction (AJUSTEMENT interdit)
      description: |
        Création refusée avec 400 si le type est AJUSTEMENT.
        Les transactions d'ajustement ne peuvent être créées que via POST /accounts/{id}/adjust-balance.
      responses:
        '400':
          description: Création directe interdite pour les transactions d'ajustement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden_type:
                  value:
                    status: 400
                    message: "Les transactions d'ajustement ne peuvent être créées que via l'endpoint adjust-balance"

  /api/transactions/{id}:
    put:
      summary: Modifier une transaction (AJUSTEMENT interdit)
      description: |
        Modification refusée avec 403 si la transaction est de type AJUSTEMENT.
      responses:
        '403':
          description: Modification interdite pour les transactions d'ajustement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                immutable:
                  value:
                    status: 403
                    message: "Les transactions d'ajustement ne peuvent pas être modifiées"
    delete:
      summary: Supprimer une transaction (AJUSTEMENT interdit)
      description: |
        Suppression refusée avec 403 si la transaction est de type AJUSTEMENT.
      responses:
        '403':
          description: Suppression interdite pour les transactions d'ajustement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                immutable:
                  value:
                    status: 403
                    message: "Les transactions d'ajustement ne peuvent pas être supprimées"

components:
  schemas:
    AdjustBalanceRequest:
      type: object
      required:
        - newBalance
      properties:
        newBalance:
          type: number
          format: decimal
          description: Le nouveau solde souhaité pour le compte (peut être négatif pour un découvert)
          example: 750.00

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        type:
          type: string
          enum: [COURANT, EPARGNE, ESPECES]
        soldeInitial:
          type: number
        solde:
          type: number
          description: Solde calculé (soldeInitial + recettes - dépenses + ajustements)
        icone:
          type: string
        couleur:
          type: string
        isDefault:
          type: boolean
        actif:
          type: boolean
        currency:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
