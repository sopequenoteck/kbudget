openapi: 3.0.3
info:
  title: Budget API - Modifications Transactions & Subscriptions
  version: 1.0.0
  description: Changements aux endpoints existants pour supporter les comptes bancaires

# Ce fichier documente uniquement les MODIFICATIONS aux contrats existants.
# Les endpoints eux-mêmes ne changent pas d'URL.

changes:
  TransactionRequest:
    description: "Ajout du champ accountId (obligatoire)"
    added_fields:
      - name: accountId
        type: UUID
        required: false
        description: |
          ID du compte auquel rattacher la transaction.
          Si absent, la transaction est rattachée au compte par défaut.
          Le compte doit être actif et appartenir à l'utilisateur.

  TransactionResponse:
    description: "Ajout des champs account et transferId"
    added_fields:
      - name: account
        type: AccountSummary
        nullable: false
        description: Résumé du compte rattaché
      - name: transferId
        type: UUID
        nullable: true
        description: |
          UUID de liaison pour les virements.
          Null pour les transactions normales.
          Les deux transactions d'un virement partagent le même UUID.

  TransactionDelete:
    description: "Comportement modifié pour les transactions de virement"
    behavior: |
      DELETE /transactions/{id} :
      - Si la transaction a un transferId non-null, la transaction liée
        (même transferId, id différent) est également supprimée en cascade.
      - Réponse 204 dans les deux cas.

  TransactionUpdate:
    description: "Propagation automatique pour les virements"
    behavior: |
      PUT /transactions/{id} :
      - Si la transaction a un transferId non-null et que le montant est modifié,
        le nouveau montant est propagé automatiquement à la transaction liée.
      - Seul le montant est propagé. Les autres champs (date, note, libellé)
        restent indépendants.

  SubscriptionRequest:
    description: "Ajout du champ accountId (optionnel)"
    added_fields:
      - name: accountId
        type: UUID
        required: false
        description: |
          ID du compte auquel rattacher l'abonnement.
          Optionnel. Si absent, l'abonnement n'est pas rattaché à un compte.

  SubscriptionResponse:
    description: "Ajout du champ account (optionnel)"
    added_fields:
      - name: account
        type: AccountSummary
        nullable: true
        description: Résumé du compte rattaché (null si non rattaché)

components:
  schemas:
    AccountSummary:
      type: object
      description: Résumé minimal d'un compte pour inclusion dans d'autres réponses
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        icone:
          type: string
        couleur:
          type: string
