openapi: 3.0.3
info:
  title: Budget API - Comptes Bancaires
  version: 1.0.0
  description: Endpoints pour la gestion des comptes bancaires

servers:
  - url: /api
    description: Context path

paths:
  /accounts:
    get:
      summary: Lister les comptes de l'utilisateur
      tags: [Comptes]
      security:
        - bearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Inclure les comptes inactifs
      responses:
        "200":
          description: Liste des comptes avec solde calculé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Non authentifié

    post:
      summary: Créer un compte
      tags: [Comptes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Données invalides ou nom dupliqué
        "401":
          description: Non authentifié

  /accounts/{id}:
    get:
      summary: Consulter un compte par ID
      tags: [Comptes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail du compte avec solde calculé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          description: Compte non trouvé

    put:
      summary: Modifier un compte
      tags: [Comptes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: |
        Modifie les propriétés d'un compte : nom, type, icône, couleur.
        Le champ soldeInitial est IGNORÉ dans cette requête (figé à la création).
        Pour modifier isDefault, utiliser PUT /accounts/{id}/default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Données invalides
        "404":
          description: Compte non trouvé

    delete:
      summary: Supprimer un compte (si aucune donnée rattachée)
      tags: [Comptes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Compte supprimé
        "400":
          description: Impossible de supprimer (transactions/abonnements rattachés)
        "404":
          description: Compte non trouvé

  /accounts/{id}/default:
    put:
      summary: Désigner un compte comme compte par défaut
      tags: [Comptes]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Compte défini par défaut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Compte inactif
        "404":
          description: Compte non trouvé

  /accounts/transfer:
    post:
      summary: Effectuer un virement entre deux comptes
      tags: [Comptes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Virement effectué (2 transactions créées)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          description: Données invalides (même compte, montant nul, compte inactif)
        "404":
          description: Compte non trouvé

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AccountRequest:
      type: object
      required: [nom, type]
      properties:
        nom:
          type: string
          minLength: 1
          maxLength: 50
          description: Nom du compte (unique par utilisateur)
        type:
          type: string
          enum: [COURANT, EPARGNE, ESPECES]
        soldeInitial:
          type: number
          format: decimal
          default: 0.00
          description: Solde initial (positif, zéro ou négatif)
        icone:
          type: string
          description: Icône emoji (défaut selon type si absent)
        couleur:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Couleur hex (défaut selon type si absent)
        actif:
          type: boolean
          description: Statut actif du compte (optionnel, ignoré en POST, utilisé en PUT pour désactiver/réactiver)

    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        type:
          type: string
          enum: [COURANT, EPARGNE, ESPECES]
        soldeInitial:
          type: number
          format: decimal
        solde:
          type: number
          format: decimal
          description: Solde calculé (soldeInitial + recettes - dépenses)
        icone:
          type: string
        couleur:
          type: string
        isDefault:
          type: boolean
        actif:
          type: boolean

    TransferRequest:
      type: object
      required: [fromAccountId, toAccountId, montant]
      properties:
        fromAccountId:
          type: string
          format: uuid
          description: Compte source
        toAccountId:
          type: string
          format: uuid
          description: Compte destination
        montant:
          type: number
          format: decimal
          minimum: 0.01
          exclusiveMinimum: false
          description: Montant du virement (strictement positif)
        note:
          type: string
          maxLength: 500
          description: Note optionnelle

    TransferResponse:
      type: object
      properties:
        transferId:
          type: string
          format: uuid
          description: UUID partagé par les deux transactions
        debitTransaction:
          $ref: "#/components/schemas/TransactionResponseRef"
        creditTransaction:
          $ref: "#/components/schemas/TransactionResponseRef"

    TransactionResponseRef:
      type: object
      description: Référence minimale d'une transaction de virement
      properties:
        id:
          type: string
          format: uuid
        montant:
          type: number
        libelle:
          type: string
        type:
          type: string
          enum: [DEPENSE, RECETTE]
        date:
          type: string
          format: date
        accountId:
          type: string
          format: uuid
        accountNom:
          type: string
