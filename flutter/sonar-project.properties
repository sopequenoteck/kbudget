sonar.projectKey=kbudget-flutter
sonar.projectName=kbudget-flutter
sonar.sources=lib
sonar.tests=test
sonar.dart.coverage.reportPath=coverage/lcov.info
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.gr.dart,**/*.config.dart,**/generated/**,**/l10n/**,**/app_localizations*.dart

# Les tests sont declares (metriques, couverture) mais pas soumis aux regles de
# maintainabilite, comme cote Angular ou `**/*.spec.ts` figure deja dans
# sonar.exclusions. Sans cet alignement, les deux projets traitaient leurs tests
# differemment : une PR Flutter ajoutant des tests etait penalisee, une PR
# Angular non. Les regles de duplication de litteraux, en particulier, sont
# contre-productives sur des tests, ou la repetition explicite est une qualite.
sonar.test.exclusions=**/*
# `app_localizations*.dart` sont generes par `flutter gen-l10n` depuis
# `app_fr.arb` (voir `l10n.yaml`) et versionnes. Le motif `**/l10n/**` ci-dessus
# visait deja a les ecarter, mais ne les atteint pas : `l10n.yaml` place la
# sortie dans `lib/src/localization/`, pas dans un repertoire `l10n`. L'exclusion
# etait donc ecrite sans jamais s'appliquer — visible seulement quand une PR y
# ajoute assez de lignes d'un coup (219 pour KKS-324).
#
# `app_localizations_fr.dart` porte un getter par cle de traduction. Sur le
# nouveau code de KKS-324, Sonar y compte 23 lignes couvrables dont 6 atteintes
# (26%) : un getter n'est couvert que si un test affiche ce texte precis. Aucun
# test ne peut donc les couvrir toutes sans rendre chaque ecran, et personne
# n'ecrit ce fichier — il est regenere a chaque modification de l'ARB.
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.gr.dart,**/main.dart,**/app_localizations*.dart

# La regle Dart « Prefer double quotes » du profil Sonar contredit frontalement
# la convention du projet : analysis_options.yaml active `prefer_single_quotes`,
# et le code compte plus de 6400 litteraux en quotes simples contre 43 en
# doubles. Laissee active, elle transforme chaque chaine ecrite dans ce projet
# en probleme de maintenabilite — 346 sur une seule PR.
#
# Le linter Dart fait autorite sur le style Dart : c'est une decision explicite
# du projet, inscrite dans sa configuration. On neutralise donc la regle ici
# plutot que cote serveur, pour que le choix reste versionne et relu.
# Chaque regle neutralisee ci-dessous contredit la convention du projet, ou
# contredit une autre regle du meme profil. Le linter Dart fait autorite sur le
# style Dart : c'est une decision explicite, inscrite dans analysis_options.yaml
# et appliquee a l'ensemble du code.
#
#   quotes      prefer_double_quotes    <-> prefer_single_quotes (projet)
#   imports     prefer_relative_imports <-> avoid_relative_lib_imports (projet)
#   final       unnecessary_final       <-> prefer_final_locals / _fields (projet)
#   finalParams prefer_final_parameters <-> unnecessary_final (meme profil Sonar :
#               l'une exige `final`, l'autre l'interdit — aucun code ne satisfait
#               les deux)
#   types       always_specify_types : le projet s'appuie sur l'inference de types,
#               comme le Dart moderne le recommande
#
# Les autres regles du profil sont respectees et corrigees dans le code.
sonar.issue.ignore.multicriteria=quotes,imports,final,finalParams,types
sonar.issue.ignore.multicriteria.quotes.ruleKey=dartanalyzer:prefer_double_quotes
sonar.issue.ignore.multicriteria.quotes.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.imports.ruleKey=dartanalyzer:prefer_relative_imports
sonar.issue.ignore.multicriteria.imports.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.final.ruleKey=dartanalyzer:unnecessary_final
sonar.issue.ignore.multicriteria.final.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.finalParams.ruleKey=dartanalyzer:prefer_final_parameters
sonar.issue.ignore.multicriteria.finalParams.resourceKey=**/*.dart
sonar.issue.ignore.multicriteria.types.ruleKey=dartanalyzer:always_specify_types
sonar.issue.ignore.multicriteria.types.resourceKey=**/*.dart
