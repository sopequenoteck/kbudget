name: k_budget
description: Application personnelle de gestion de budget
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1

  # Icons
  phosphor_flutter: ^2.1.0

  # Routing
  go_router: ^14.8.1

  # Database (local)
  drift: ^2.23.1
  drift_flutter: ^0.2.4

  # HTTP client
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Biometric auth
  local_auth: ^2.3.0

  # Crypto
  crypto: ^3.0.6

  # SVG
  flutter_svg: ^2.0.17

  # Shimmer (skeleton loading)
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.70.2

  # Emoji picker
  emoji_picker_flutter: ^4.4.0

  # Image picker & file storage
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1
  diacritic: ^0.1.6
  stomp_dart_client: ^3.0.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Linting
  flutter_lints: ^6.0.0

  # Mocking
  mockito: ^5.4.5
  build_runner_core: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter/
    - assets/budget-icon-no-background.svg
    - assets/banks/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

  generate: true
