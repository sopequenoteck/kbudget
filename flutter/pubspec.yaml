name: k_budget
description: Application personnelle de gestion de budget
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database (local)
  drift: ^2.23.1
  drift_flutter: ^0.2.4

  # HTTP client
  dio: ^5.8.0+1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Biometric auth
  local_auth: ^2.3.0

  # Firebase (crash reporting)
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.5

  # Crypto
  crypto: ^3.0.6

  # SVG
  flutter_svg: ^2.0.17

  # Shimmer (skeleton loading)
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Linting
  flutter_lints: ^6.0.0

  # Mocking
  mockito: ^5.4.5
  build_runner_core: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Inter/
    - assets/budget-icon-no-background.svg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700

  generate: true
